<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madaris Management System (MMS) - Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #047857;
      --primary-hover: #065f46;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    header {
      background: linear-gradient(135deg, #065f46 0%, #047857 100%);
      color: white;
      padding: 24px 32px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    header .subtitle { font-size: 0.875rem; opacity: 0.85; margin-top: 2px; }

    .badge-count {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
    }

    .student-header {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      align-items: center;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #10b981;
      background-color: #ecfdf5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #047857;
      font-size: 1.25rem;
    }

    .student-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }

    .program-tag {
      display: inline-block;
      background: #ecfdf5;
      color: #047857;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 12px;
      margin-top: 4px;
    }

    .details-list {
      border-top: 1px dashed var(--border);
      padding-top: 12px;
      margin-top: 12px;
      font-size: 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
    }

    .detail-label { color: var(--text-muted); }
    .detail-val { font-weight: 600; color: var(--text); }

    .btn-approve {
      width: 100%;
      margin-top: 16px;
      padding: 10px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .btn-approve:hover {
      background: var(--primary-hover);
    }

    .btn-approve:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .empty-state {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      color: #10b981;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #065f46;
      color: white;
      padding: 14px 24px;
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
      font-weight: 500;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🕌 Madaris Management System</h1>
      <div class="subtitle">Admin Dashboard — Pending Registrations Portal</div>
    </div>
    <div class="badge-count" id="pendingCount">Loading...</div>
  </header>

  <div class="container">
    <div class="section-title">
      Pending Student Applications
    </div>

    <div id="cardsGrid" class="grid">
      <!-- Dynamic Pending Cards -->
    </div>
  </div>

  <div id="toast" class="toast">Action completed successfully</div>

  <script>
    async function loadPendingStudents() {
      const grid = document.getElementById('cardsGrid');
      const countBadge = document.getElementById('pendingCount');
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px;">Fetching pending applications...</div>';

      try {
        const res = await fetch('/api/admin/pending');
        const data = await res.json();

        if (data.success && data.students) {
          countBadge.textContent = `${data.count} Pending Approval${data.count === 1 ? '' : 's'}`;
          
          if (data.students.length === 0) {
            grid.innerHTML = `
              <div class="empty-state" style="grid-column: 1/-1;">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h3>No Pending Applications</h3>
                <p>All student registrations have been reviewed and processed.</p>
              </div>
            `;
            return;
          }

          grid.innerHTML = data.students.map(s => {
            const initials = `${s.firstName[0] || ''}${s.lastName[0] || ''}`.toUpperCase();
            const avatarHtml = s.pictureUrl 
              ? `<img src="${s.pictureUrl}" alt="Photo" class="avatar">` 
              : `<div class="avatar">${initials}</div>`;

            return `
              <div class="card" id="card-${s._id}">
                <div class="student-header">
                  ${avatarHtml}
                  <div>
                    <div class="student-name">${escapeHtml(s.firstName)} ${escapeHtml(s.lastName)}</div>
                    <div class="program-tag">${escapeHtml(s.enrollmentProgram)}</div>
                  </div>
                </div>

                <div class="details-list">
                  <div class="detail-row"><span class="detail-label">Father Name:</span> <span class="detail-val">${escapeHtml(s.fatherName)}</span></div>
                  <div class="detail-row"><span class="detail-label">CNIC / B-Form:</span> <span class="detail-val">${escapeHtml(s.cnic)}</span></div>
                  <div class="detail-row"><span class="detail-label">City:</span> <span class="detail-val">${escapeHtml(s.city)}</span></div>
                  <div class="detail-row"><span class="detail-label">Guardian Mobile:</span> <span class="detail-val">${escapeHtml(s.guardianMobile)}</span></div>
                  <div class="detail-row"><span class="detail-label">Guardian Email:</span> <span class="detail-val">${escapeHtml(s.guardianEmail)}</span></div>
                  <div class="detail-row"><span class="detail-label">Address:</span> <span class="detail-val">${escapeHtml(s.address)}</span></div>
                </div>

                <button class="btn-approve" onclick="approveStudent('${s._id}', '${escapeHtml(s.firstName)}')" id="btn-${s._id}">
                  ✓ Approve Application & Send Email
                </button>
              </div>
            `;
          }).join('');
        }
      } catch (err) {
        grid.innerHTML = `<div style="color: red; grid-column: 1/-1;">Error loading applications: ${err.message}</div>`;
      }
    }

    async function approveStudent(studentId, name) {
      const btn = document.getElementById(`btn-${studentId}`);
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'Approving & Dispatching Email...';
      }

      try {
        const res = await fetch(`/api/admin/approve/${studentId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showToast(`✅ ${name} approved! Email notification sent.`);
          loadPendingStudents();
        } else {
          alert(`Error: ${data.error || 'Failed to approve student'}`);
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '✓ Approve Application & Send Email';
          }
        }
      } catch (err) {
        alert(`Network Error: ${err.message}`);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '✓ Approve Application & Send Email';
        }
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    window.onload = loadPendingStudents;
  </script>
</body>
</html>
